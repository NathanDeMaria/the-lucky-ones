name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded PR runs are pointless, but let pushes to main finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Inline annotations on the PR diff instead of plain console output
      RUFF_OUTPUT_FORMAT: github
      TY_OUTPUT_FORMAT: github
    steps:
      - uses: actions/checkout@v7

      # Installs uv, restores its cache keyed on uv.lock, and -- with
      # python-version set -- provisions the interpreter too, so there's no
      # separate setup-python step to keep in sync with .python-version.
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.17"
          python-version: "3.14"
          enable-cache: true

      # `uv run` inside make would sync anyway; doing it here means a
      # resolution or download failure reports as its own red step rather than
      # as a confusing lint failure.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: make check

      - name: Test
        run: make test
